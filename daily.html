<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>每日使用统计报告</title>
    <link rel="icon" type="image/x-icon" href="/statistics.ico">
    <script src="/echarts.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dashboard-wrapper {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            flex: 0 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 40px;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .header h2 {
            margin: 0;
            flex-shrink: 0;
        }

        h2 {
            margin: 0;
            color: #333;
            font-size: 28px;
            line-height: 1.2;
            display: flex;
            align-items: center;
        }

        input[type="date"] {
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            color: #555;
            outline: none;
            vertical-align: middle;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            vertical-align: middle;
            padding-left: 4px;
        }

        input[type="date"]:focus {
            border-color: #36A2EB;
        }

        .stats-right {
            display: flex;
            gap: 10px;
        }

        .stats-right .stat-card {
            flex: 1;
            min-width: 0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-left: 10px solid #ccc;
        }

        .stat-card.total {
            border-left-color: #4BC0C0;
        }

        .stat-card.active {
            border-left-color: #36A2EB;
        }

        .stat-card.idle {
            border-left-color: #FF9F40;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content-area {
            flex: 1;
            display: flex;
            gap: 10px;
            min-height: 0;
            height: calc(100% - 50px);
        }

        .chart-box {
            flex: 4;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .chart-wrapper {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            min-height: 320px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
            margin-top: 12px;
        }

        #summaryBarWrap {
            flex: 1;
            min-width: 0;
            height: 44px;
            align-self: center;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-sizing: border-box;
        }

        #datePicker {
            flex-shrink: 0;
            margin-left: auto;
        }

        .details-box {
            flex: 6;
        }

        .details-list {
            margin-top: 12px;
            padding: 1rem;
            border-radius: 8px;
            background: white;
            overflow-y: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            height: calc(100% - 148px);
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        li {
            margin-bottom: 8px;
        }

        .app-row {
            cursor: pointer;
            padding: 10px 15px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .app-row:hover {
            background: #e9ecef;
        }

        .app-name {
            font-weight: 600;
            color: #444;
        }

        .toggle-icon {
            margin-right: 8px;
            font-weight: bold;
            color: #999;
            display: inline-block;
            width: 16px;
            text-align: center;
        }

        .sub-list {
            padding-left: 35px;
            display: none;
            margin-top: 5px;
            border-left: 2px solid #eee;
            margin-left: 10px;
        }

        .sub-item {
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
        }

        .active .sub-list {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">
        <div class="header">
            <h2 id="dailyTitle">每日统计</h2>
            <div id="summaryBarWrap">
                <div id="summaryBarChart" style="width:100%;height:100%;"></div>
            </div>
            <input type="date" id="datePicker" onchange="onDateChange(this.value)">
        </div>

        <div class="content-area">
            <div class="chart-box">
                <div class="stat-card total">
                    <div class="stat-value" id="totalUsed">-</div>
                    <div class="stat-label">系统运行时长</div>
                </div>

                <div class="chart-wrapper">
                    <div id="usagePieChart" style="width:100%;height:100%;"></div>
                </div>
            </div>
            <div class="details-box">
                <div class="stats-right">
                    <div class="stat-card active">
                        <div class="stat-value" id="effectiveTime">-</div>
                        <div class="stat-label">有效使用时间</div>
                    </div>
                    <div class="stat-card idle">
                        <div class="stat-value" id="idleTime">-</div>
                        <div class="stat-label">闲置时长</div>
                    </div>
                </div>
                <ul class="details-list" id="detailsList"></ul>
                <div id="noDataMsg" style="text-align:center; color:#999; margin-top:50px; display:none;">
                    所选日期无数据
                </div>
            </div>
        </div>
    </div>

    <script>
        let usageChart = null;
        let summaryBarChart = null;

        function secondsToMinutes(sec) { return (sec / 60).toFixed(1) + ' 分钟'; }
        function formatPrettyTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}小时 ${m}分`;
        }
        function secondsToHMS(d) {
            d = Number(d);
            var h = Math.floor(d / 3600);
            var m = Math.floor(d % 3600 / 60);
            var s = Math.floor(d % 3600 % 60);
            return (h > 0 ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }

        function toDashDate(str) {
            return str.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3");
        }
        function toPlainDate(str) {
            return str.replace(/-/g, "");
        }

        fetch('/api/dates')
            .then(r => r.json())
            .then(dates => {
                const picker = document.getElementById('datePicker');
                if (dates.length > 0) {
                    const maxDate = toDashDate(dates[0]);
                    const minDate = toDashDate(dates[dates.length - 1]);
                    picker.max = maxDate;
                    picker.min = minDate;
                    picker.value = maxDate;
                    loadReport(dates[0]);
                }
            });

        function onDateChange(dateStr) {
            if (!dateStr) return;
            loadReport(toPlainDate(dateStr));
        }

        function loadReport(date) {
            fetch(`/api/data/${date}`)
                .then(r => {
                    if (!r.ok) throw new Error("No Data");
                    return r.json();
                })
                .then(data => {
                    if (!data.sessions || data.sessions.length === 0) {
                        document.getElementById('noDataMsg').style.display = 'block';
                        document.querySelector('.content-area').style.display = 'none';
                        clearDashboard();
                        return;
                    }
                    document.getElementById('noDataMsg').style.display = 'none';
                    document.querySelector('.content-area').style.display = 'flex';
                    document.getElementById('detailsList').style.display = 'block';
                    renderDashboard(data);
                })
                .catch(() => {
                    document.getElementById('noDataMsg').style.display = 'block';
                    document.querySelector('.content-area').style.display = 'none';
                    clearDashboard();
                });
        }

        function clearDashboard() {
            document.getElementById('totalUsed').innerText = '-';
            document.getElementById('effectiveTime').innerText = '-';
            document.getElementById('idleTime').innerText = '-';
            document.getElementById('dailyTitle').innerText = '每日统计';
            if (usageChart) { usageChart.clear(); }
            if (summaryBarChart) { summaryBarChart.clear(); }
        }

        function renderDashboard(data) {
            const sessions = data.sessions || [];
            let totalRunSeconds = 0;
            let loginTimeStr = '';
            let logoutTimeStr = '';

            const picker = document.getElementById('datePicker');
            const selectedDate = picker ? picker.value : null;
            const today = new Date().toISOString().split('T')[0];
            const isToday = selectedDate === today;

            if (sessions.length > 0) {
                const firstSession = sessions[0];
                if (firstSession && firstSession.length >= 1) {
                    let loginTime = firstSession[0];
                    if (typeof loginTime === 'string') {
                        const parts = loginTime.split(' ');
                        loginTimeStr = parts.length > 1 ? parts[1] : loginTime;
                    } else {
                        loginTimeStr = new Date(loginTime * 1000).toLocaleTimeString('zh-CN', { hour12: false });
                    }
                }
                const lastSession = sessions[sessions.length - 1];
                if (lastSession && lastSession.length >= 2) {
                    let logoutTime = lastSession[1];
                    if (typeof logoutTime === 'string') {
                        const parts = logoutTime.split(' ');
                        logoutTimeStr = parts.length > 1 ? parts[1] : logoutTime;
                    } else {
                        logoutTimeStr = new Date(logoutTime * 1000).toLocaleTimeString('zh-CN', { hour12: false });
                    }
                }
            }

            let titleText = '每日统计';
            if (loginTimeStr) {
                titleText += ` (${loginTimeStr} -`;
            }
            if (logoutTimeStr && !isToday) {
                titleText += ` ${logoutTimeStr})`;
            }
            document.getElementById('dailyTitle').innerText = titleText;

            if (sessions.length > 0) {
                totalRunSeconds = sessions.reduce((acc, curr) => {
                    let start, end;
                    if (typeof curr[0] === 'string') {
                        start = new Date(curr[0].replace(' ', 'T')).getTime() / 1000;
                        end = new Date(curr[1].replace(' ', 'T')).getTime() / 1000;
                    } else {
                        start = curr[0];
                        end = curr[1];
                    }
                    return acc + (end - start);
                }, 0);
            }

            const idleSeconds = data.idle_seconds || 0;
            let effectiveSeconds = Math.max(0, totalRunSeconds - idleSeconds);

            document.getElementById('totalUsed').innerText = formatPrettyTime(totalRunSeconds);
            document.getElementById('effectiveTime').innerText = formatPrettyTime(effectiveSeconds);
            document.getElementById('idleTime').innerText = formatPrettyTime(idleSeconds);

            const appsObj = data.apps || {};
            let appsArray = Object.keys(appsObj).map(exeName => {
                const appData = appsObj[exeName];
                const titlesArray = Object.entries(appData.titles).map(([title, time]) => ({
                    title, time
                })).sort((a, b) => b.time - a.time);
                return { name: exeName, total: appData.total, titles: titlesArray };
            });
            appsArray.sort((a, b) => b.total - a.total);

            const list = document.getElementById('detailsList');
            list.innerHTML = '';
            appsArray.forEach(app => {
                const li = document.createElement('li');
                const row = document.createElement('div');
                row.className = 'app-row';
                row.innerHTML = `<span class="app-name"><span class="toggle-icon">+</span> ${app.name}</span> <span>${secondsToMinutes(app.total)}</span>`;
                row.onclick = () => {
                    li.classList.toggle('active');
                    row.querySelector('.toggle-icon').innerText = li.classList.contains('active') ? '-' : '+';
                };
                const subDiv = document.createElement('div');
                subDiv.className = 'sub-list';
                app.titles.forEach(t => {
                    const item = document.createElement('div');
                    item.className = 'sub-item';
                    const cleanTitle = t.title.length > 50 ? t.title.substring(0, 50) + '...' : t.title;
                    item.innerHTML = `<span title="${t.title}">${cleanTitle}</span> <span>${secondsToHMS(t.time)}</span>`;
                    subDiv.appendChild(item);
                });
                li.appendChild(row);
                li.appendChild(subDiv);
                list.appendChild(li);
            });

            renderCharts(effectiveSeconds, idleSeconds, appsArray);
        }

        function renderCharts(active, idle, appsArray) {
            const pieColors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#E7E9ED', '#76A346', '#F28A8A', '#6B5B95'];

            // --- Doughnut chart ---
            const pieContainer = document.getElementById('usagePieChart');
            if (!usageChart) {
                usageChart = echarts.init(pieContainer);
            }
            const topN = 8;
            let displayData = appsArray.slice(0, topN).map(a => ({ name: a.name, value: a.total }));
            if (appsArray.length > topN) {
                displayData.push({ name: '其他应用', value: appsArray.slice(topN).reduce((acc, c) => acc + c.total, 0) });
            }
            usageChart.setOption({
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        return `${params.name}: ${secondsToMinutes(params.value)} (${params.percent}%)`;
                    }
                },
                legend: {
                    orient: 'horizontal',
                    bottom: 0,
                    textStyle: { fontSize: 14, fontWeight: 'bold' },
                    itemWidth: 20,
                    itemHeight: 20,
                    padding: [15, 0, 0, 0]
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '65%'],
                    center: ['50%', '45%'],
                    data: displayData,
                    color: pieColors,
                    label: { show: false },
                    emphasis: {
                        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
                    }
                }]
            }, true);

            // --- Summary bar ---
            const barContainer = document.getElementById('summaryBarChart');
            if (!summaryBarChart) {
                summaryBarChart = echarts.init(barContainer);
            }
            const barTotal = active + idle;
            const runtimePercent = barTotal > 0 ? (active / barTotal * 100) : 0;
            const idlePercent = barTotal > 0 ? (idle / barTotal * 100) : 0;

            summaryBarChart.setOption({
                grid: { left: 0, right: 0, top: 0, bottom: 0 },
                xAxis: { type: 'value', max: 100, show: false },
                yAxis: { type: 'category', data: [''], show: false },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    formatter: function (params) {
                        return params.map(p => {
                            const timeValue = p.seriesIndex === 0 ? active : idle;
                            return `${p.seriesName}: ${p.value.toFixed(1)}% (${secondsToMinutes(timeValue)})`;
                        }).join('<br>');
                    }
                },
                series: [
                    {
                        name: '运行时长',
                        type: 'bar',
                        stack: 'total',
                        data: [runtimePercent],
                        barWidth: '100%',
                        itemStyle: { color: '#36A2EB', borderRadius: 0 }
                    },
                    {
                        name: '闲置',
                        type: 'bar',
                        stack: 'total',
                        data: [idlePercent],
                        barWidth: '100%',
                        itemStyle: { color: '#FF9F40', borderRadius: 0 }
                    }
                ]
            }, true);
        }

        window.addEventListener('resize', function () {
            if (usageChart) usageChart.resize();
            if (summaryBarChart) summaryBarChart.resize();
        });
    </script>
</body>

</html>
