<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>过去7天使用趋势</title>
    <link rel="icon" type="image/x-icon" href="/statistics_light.ico" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/x-icon" href="/statistics_dark.ico" media="(prefers-color-scheme: dark)">
    <script src="/echarts.min.js"></script>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dashboard-wrapper {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin: 0;
            color: #333;
            font-size: 20px;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date-label {
            font-size: 14px;
            color: #666;
        }

        input[type="date"] {
            padding: 6px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            color: #555;
            outline: none;
        }

        .stats-grid {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #ccc;
        }

        .stat-card.total {
            border-left-color: #4BC0C0;
        }

        .stat-card.active {
            border-left-color: #36A2EB;
        }

        .stat-card.idle {
            border-left-color: #FF9F40;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .content-area {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chart-wrapper {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">
        <div class="header">
            <h2>过去 7 天使用概览</h2>
            <div class="date-controls">
                <span class="date-label">结束日期:</span>
                <input type="date" id="endDatePicker" onchange="onDateChange(this.value)">
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-value" id="totalRunWeek">-</div>
                <div class="stat-label">7天总开机时长</div>
            </div>
            <div class="stat-card active">
                <div class="stat-value" id="totalActiveWeek">-</div>
                <div class="stat-label">7天总有效使用</div>
            </div>
            <div class="stat-card idle">
                <div class="stat-value" id="totalIdleWeek">-</div>
                <div class="stat-label">7天总闲置</div>
            </div>
        </div>

        <div class="content-area">
            <div class="left-panel">
                <div class="chart-wrapper">
                    <div class="chart-title">每日 有效 vs 闲置</div>
                    <div class="chart-container">
                        <div id="weeklyTrendChart" style="width:100%;height:100%;"></div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="chart-wrapper">
                    <div class="chart-title">7天应用使用总时长占比</div>
                    <div class="chart-container">
                        <div id="weeklyAppChart" style="width:100%;height:100%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let trendChart = null;
        let appChart = null;

        function formatMinutes(seconds) { return (seconds / 60).toFixed(1) + ' 分钟'; }
        function formatPrettyTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}小时 ${m}分`;
        }

        function toDashDate(str) { return str.replace(/^(\d{4})(\d{2})(\d{2})$/, "$1-$2-$3"); }

        function generatePast7Days(endDateStr) {
            const dates = [];
            let current = new Date(endDateStr);
            for (let i = 0; i < 7; i++) {
                const y = current.getFullYear();
                const m = String(current.getMonth() + 1).padStart(2, '0');
                const d = String(current.getDate()).padStart(2, '0');
                dates.push(`${y}${m}${d}`);
                current.setDate(current.getDate() - 1);
            }
            return dates.reverse();
        }

        fetch('/api/dates')
            .then(r => r.json())
            .then(dates => {
                if (dates.length > 0) {
                    const maxDate = toDashDate(dates[0]);
                    const minDate = toDashDate(dates[dates.length - 1]);
                    const picker = document.getElementById('endDatePicker');
                    picker.max = maxDate;
                    picker.min = minDate;
                    picker.value = maxDate;
                    onDateChange(maxDate);
                }
            });

        function onDateChange(endDateStr) {
            if (!endDateStr) return;
            const targetDates = generatePast7Days(endDateStr);
            loadWeekData(targetDates);
        }

        async function loadWeekData(targetDates) {
            const requests = targetDates.map(date =>
                fetch(`/api/data/${date}`)
                    .then(r => r.json())
                    .then(json => ({ date: date, data: json }))
                    .catch(() => ({ date: date, data: { sessions: [], idle_seconds: 0, apps: {} } }))
            );
            const results = await Promise.all(requests);
            processData(results);
        }

        function processData(results) {
            let grandTotalRun = 0;
            let grandTotalIdle = 0;
            let grandTotalActive = 0;
            let aggregatedApps = {};
            let chartLabels = [];
            let dataActive = [];
            let dataIdle = [];

            results.forEach(item => {
                chartLabels.push(item.date);
                if (!item.data) {
                    dataActive.push(0);
                    dataIdle.push(0);
                    return;
                }
                const json = item.data;
                const sessions = json.sessions || [];
                const dayRun = sessions.reduce((acc, curr) => {
                    let start, end;
                    if (typeof curr[0] === 'string') {
                        start = new Date(curr[0].replace(' ', 'T')).getTime() / 1000;
                        end = new Date(curr[1].replace(' ', 'T')).getTime() / 1000;
                    } else {
                        start = curr[0];
                        end = curr[1];
                    }
                    return acc + (end - start);
                }, 0);
                const dayIdle = json.idle_seconds || 0;
                const dayActive = Math.max(0, dayRun - dayIdle);

                grandTotalRun += dayRun;
                grandTotalIdle += dayIdle;
                grandTotalActive += dayActive;

                dataActive.push(dayActive);
                dataIdle.push(dayIdle);

                const apps = json.apps || {};
                for (let appName in apps) {
                    const appTotal = apps[appName].total || 0;
                    if (!aggregatedApps[appName]) aggregatedApps[appName] = 0;
                    aggregatedApps[appName] += appTotal;
                }
            });

            document.getElementById('totalRunWeek').innerText = formatPrettyTime(grandTotalRun);
            document.getElementById('totalActiveWeek').innerText = formatPrettyTime(grandTotalActive);
            document.getElementById('totalIdleWeek').innerText = formatPrettyTime(grandTotalIdle);

            renderTrendChart(chartLabels, dataActive, dataIdle);
            renderAppChart(aggregatedApps);
        }

        function renderTrendChart(labels, activeData, idleData) {
            const container = document.getElementById('weeklyTrendChart');
            if (!trendChart) {
                trendChart = echarts.init(container);
            }
            trendChart.setOption({
                tooltip: {
                    trigger: 'axis',
                    formatter: function (params) {
                        let total = 0;
                        let lines = params.map(p => {
                            total += p.value;
                            return `${p.marker} ${p.seriesName}: ${formatPrettyTime(p.value)}`;
                        });
                        lines.push(`总开机: ${formatPrettyTime(total)}`);
                        return lines.join('<br>');
                    }
                },
                legend: {
                    data: ['有效使用', '闲置时长'],
                    bottom: 0
                },
                grid: {
                    left: 50,
                    right: 20,
                    top: 10,
                    bottom: 40
                },
                xAxis: {
                    type: 'category',
                    data: labels
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: function (val) {
                            return (val / 3600).toFixed(0) + 'h';
                        }
                    }
                },
                series: [
                    {
                        name: '有效使用',
                        type: 'bar',
                        stack: 'combined',
                        data: activeData,
                        itemStyle: { color: '#36A2EB' }
                    },
                    {
                        name: '闲置时长',
                        type: 'bar',
                        stack: 'combined',
                        data: idleData,
                        itemStyle: { color: '#FF9F40' }
                    }
                ]
            }, true);
        }

        function renderAppChart(appDataObj) {
            const container = document.getElementById('weeklyAppChart');
            if (!appChart) {
                appChart = echarts.init(container);
            }

            let appsArray = Object.keys(appDataObj).map(name => ({ name, value: appDataObj[name] }));
            appsArray.sort((a, b) => b.value - a.value);

            const topN = 10;
            let displayData = appsArray.slice(0, topN);
            if (appsArray.length > topN) {
                displayData.push({ name: '其他应用', value: appsArray.slice(topN).reduce((acc, c) => acc + c.value, 0) });
            }

            const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#E7E9ED', '#76A346', '#F28A8A', '#6B5B95', '#D3D3D3'];

            appChart.setOption({
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        const total = displayData.reduce((a, b) => a + b.value, 0);
                        const pct = total > 0 ? (params.value / total * 100).toFixed(1) + '%' : '0%';
                        return `${params.name}: ${formatMinutes(params.value)} (${pct})`;
                    }
                },
                legend: {
                    orient: 'horizontal',
                    bottom: 0,
                    textStyle: { fontSize: 12 },
                    itemWidth: 12,
                    itemHeight: 12
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '65%'],
                    center: ['50%', '45%'],
                    data: displayData,
                    color: colors,
                    label: { show: false },
                    emphasis: {
                        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' }
                    }
                }]
            }, true);
        }

        window.addEventListener('resize', function () {
            if (trendChart) trendChart.resize();
            if (appChart) appChart.resize();
        });
    </script>
</body>

</html>
